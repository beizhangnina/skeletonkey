apis:
  - id: "agentline"
    name: "AgentLine"
    capability: "Rents an agent a real US phone number with a hosted AI voice that places and answers calls and receives texts."
    category: "communications"
    provider_url: "https://agentline.cloud"
    docs_url: "https://docs.agentline.cloud"
    access_mode: "own-account"
    signup: "unknown"
    signup_automatable: "unknown"
    min_topup: null
    billing_unit: null
    free_tier: null
    auth_type: "api_key"
    seen_in: ["monid"]
    tos_notes: "Direct vendor account is the documented path; review the vendor's own API terms, rate limits and redistribution rules."
    source_url: "https://monid.ai/tools/agentline"
    checked_date: 2026-10-25
    official_docs_url: "https://docs.agentline.cloud"
    auth:
      type: "bearer"
      header: "Authorization"
      format: "Bearer <API_KEY>"
      docs_url: "https://docs.agentline.cloud/authentication"
    pricing:
      model: "subscription"
      free_tier: true
      starting_price_usd: 20
      unit: "per month"
      pricing_url: null
      notes: "First US/CA number free with 7-day trial (10 call min, 10 SMS). Extra numbers $3.00/mo; calls beyond allowance $0.12/min; SMS beyond allowance $0.02/message."
      api_access_gate: "subscription_required"
      min_monthly_usd: 20
      min_prepay_usd: null
      gate_source_url: "https://agentline.cloud/pricing"
    endpoints:
      - method: "POST"
        path: "/v1/agents"
        summary: "Create a new AI voice agent with a system prompt, greeting, voice, and voicemail settings; then attach a phone number to it."
        returns: "The created agent object, including id, account_id, name, voice settings, and created_at."
        docs_url: "https://docs.agentline.cloud/api-reference/agents/create-agent.md"
      - method: "GET"
        path: "/v1/events"
        summary: "Poll the event mailbox for call completions, transcripts, and failures; events are deleted once consumed."
        returns: "Pending telephony events, filterable by agent_id and event_type, with a limit of 1-200."
        docs_url: "https://docs.agentline.cloud/api-reference/events/list-events.md"
      - method: "PATCH"
        path: "/v1/numbers/{number_id}/reassign"
        summary: "Move an existing phone number from one AI agent to another; the target agent must not already have an active number."
        returns: "Successful response (200); the number stays active, only agent ownership changes."
        docs_url: "https://docs.agentline.cloud/api-reference/numbers/reassign-number.md"
      - method: "POST"
        path: "/v1/calls"
        summary: "Place an outbound call from the agent's number; the agent handles the conversation using its prompt, voice, and greeting."
        returns: "Right after dialing: call id, agent_id, from_number, to_number, direction, status, started_at."
        docs_url: "https://docs.agentline.cloud/llms-full.txt"
      - method: "GET"
        path: "/v1/billing/expenditure/numbers"
        summary: "List phone number provisioning charges, paginated by limit and offset."
        returns: "Cost of each phone number bought, including the number, country, and current status."
        docs_url: "https://docs.agentline.cloud/api-reference/billing/get-number-expenditure.md"
    alternatives:
      - vendor_id: "saperly"
        why: "US phone numbers for agents with calling and SMS; prepaid pay-as-you-go, no seats or platform fee. Hosted AI voice not verified."
        access_gate: "none"
    cost_badge: "red"
    usage_api:
      available: true
      method: "GET"
      path: "https://api.agentline.cloud/v1/billing/balance"
      docs_url: "https://docs.agentline.cloud/api-reference/billing/get-balance.md"
      limits: "Authorization: Bearer al_live_... (legacy sk_live_...) required"
      notes: null
