        docs_url: "https://docs.agentmail.to/openapi.json"
      - method: "GET"
        path: "/v0/pods/{pod_id}/forwarding"
        summary: "Retrieves the forwarding destinations configured at the pod level, which its inboxes inherit when they set none."
        returns: "200 with destinations (nullable string list) and unverified addresses; 403/404 errors."
