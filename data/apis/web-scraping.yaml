        returns: "The list of available SKUs in the catalog."
        docs_url: "https://getanyapi.com/llms.txt"
      - method: "POST"
        path: "/v1/apis/{sku}/quote"
        summary: "Price and validate the exact input for a SKU before spending; nothing is executed or charged."
        returns: "A price quote for the exact request; it is free and nothing is executed or charged."
        docs_url: "https://getanyapi.com/llms.txt"
      - method: "GET"
        path: "/v1/requests/{requestId}"
        summary: "Read the stored state of a durable Request by polling; polling never repeats the paid provider operation."
        returns: "Request snapshot with a public status of queued, running, succeeded, failed, or expired."
        docs_url: "https://getanyapi.com/docs/durable-requests"
