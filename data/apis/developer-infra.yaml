    endpoints:
      - method: "POST"
        path: "/v1/agents"
        summary: "Create a reusable Agent with a name, optional system prompt, and optional result schema guiding every run that references it."
        returns: "201 with an Agent object containing agentId, name, systemPrompt, resultSchema, createdAt, and updatedAt."
        docs_url: "https://docs.browserbase.com/reference/api/create-an-agent.md"
      - method: "GET"
        path: "/v1/agents"
        summary: "List agents across the account, filterable by creation time, with limit and cursor pagination."
        returns: "200 with a page of agents: data array, limit, and nextCursor (null when no more results)."
        docs_url: "https://docs.browserbase.com/reference/api/openapi.v1.yaml"
      - method: "POST"
        path: "/v1/agents/runs"
        summary: "Run a browser agent to complete a natural-language task using web search and browser tooling, optionally with a custom agentId, variables, and browser settings."
        returns: "Response body not stated in the provided excerpt (schema truncated after request fields)."
        docs_url: "https://docs.browserbase.com/reference/api/openapi.v1.yaml"
      - method: "POST"
        path: "/v1/sessions/{id}/recording/downloads"
        summary: "Request one downloadable MP4 per recorded page of a session; assembly is asynchronous and re-posting re-enqueues and retries pages."
        returns: "202 with a downloads array of RecordingDownload objects (pageId, status); GET polling returns per-page status and download URLs."
        docs_url: "https://docs.browserbase.com/reference/api/create-session-recording-downloads.md"
