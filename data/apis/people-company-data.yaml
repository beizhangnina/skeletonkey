    official_docs_url: "https://docs.akta.pro/"
    auth:
      type: "api_key"
      header: "x-api-key"
      format: "x-api-key: <API_KEY>"
      docs_url: "https://docs.akta.pro/docs/company-data/quick-start.md"
    pricing:
      model: "pay_as_you_go"
      free_tier: null
      starting_price_usd: null
      unit: "credits per API call"
      pricing_url: "https://docs.akta.pro/getting-started/overview"
      notes: "Usage is metered in credits that vary by endpoint/section; some commands are billed per record."
    endpoints:
      - method: "GET"
        path: "/api/v1/news"
        summary: "Fetch news articles enriched with AI summaries, sentiment, event types, publisher metadata, industry tags, and company mentions; supports filters and pagination."
        returns: "JSON with total, limit, offset, count and a data array of enriched article objects including full_text, entities, and scores."
        docs_url: "https://docs.akta.pro/api-reference/news-signals"
      - method: "GET"
        path: "/v1/company/employee-reviews"
        summary: "Fetch a company's employee review data: overall rating, dimension-level ratings per provider, and a paginated list of individual reviews."
        returns: "JSON with data.employee_reviews (overall_rating, other_ratings, reviews) plus limit, offset, and credits_consumed."
        docs_url: "https://docs.akta.pro/llms-full.txt"
      - method: "POST"
        path: "/api/v1/list/filter-builder/"
        summary: "Converts a natural language description of target companies into the structured filters object accepted by the List Generation API."
        returns: "JSON with a data.filters object of dotted-path filter keys and a credits_consumed value; no companies are returned."
        docs_url: "https://docs.akta.pro/api-reference/supporting-apis/filter-builder.md"
      - method: "GET"
        path: "/api/v1/company/search/"
        summary: "Resolve a company from a free-text query; the overview page uses it as the first request to try."
        returns: "JSON with a data array of companies, each with name, website, company_status, and product_category."
        docs_url: "https://docs.akta.pro/getting-started/overview"
      - method: "GET"
        path: "/api/v1/company/enrichment/"
        summary: "Enrich a company by UUID or website, requesting one or more data sections such as firmographic."
        returns: "JSON with data.uuid, the requested section objects (e.g. firmographic), and credits_consumed."
        docs_url: "https://docs.akta.pro/docs/company-data/quick-start.md"
