        path: "/api/v1/company/search/"
        summary: "Resolve a company from a free-text query; the overview page uses it as the first request to try."
        returns: "JSON with a data array of companies, each with name, website, company_status, and product_category."
        docs_url: "https://docs.akta.pro/getting-started/overview"
      - method: "GET"
        path: "/api/v1/company/enrichment/"
        summary: "Enrich a company by UUID or website, requesting one or more data sections such as firmographic."
        returns: "JSON with data.uuid, the requested section objects (e.g. firmographic), and credits_consumed."
