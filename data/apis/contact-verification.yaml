    endpoints:
      - method: "POST"
        path: "/apiv2/hlr"
        summary: "Live HLR lookup for one number or a batch of up to 80; returns number type, live status, original/current network, porting info and optional extras."
        returns: "A results array with per-number objects containing live_status, telephone_number_type, network details, is_ported, credits_spent and uuid."
        docs_url: "https://www.hlrlookup.com/hlr-api-v2.openapi.json"
      - method: "POST"
        path: "/apiv2/mnp"
        summary: "Mobile Number Portability lookup; same request/response shape as /apiv2/hlr but omits telephone_number_type for country code 1 (NANP) numbers."
        returns: "An MNP results array in the same shape as the HLR endpoint, with telephone_number_type omitted for NANP numbers."
        docs_url: "https://www.hlrlookup.com/hlr-api-v2.openapi.json"
      - method: "POST"
        path: "/apiv2/validate"
        summary: "Format-only validation of one or more numbers without a live HLR lookup; returns number type, issuing network details and formatted output."
        returns: "A subset of the HLR response; live_status, current_network, is_ported, ported_date, landline_status, sms_email, mms_email and cache fields are omitted."
        docs_url: "https://www.hlrlookup.com/hlr-api-v2.openapi.json"
