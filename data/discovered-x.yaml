      with 'Bearer '\") and `source` (\"The source of your API call\"). All three are
      recorded in auth_headers: the two credentials with a {key} template, and `source`
      with secret: false and a null format, since the docs enumerate no accepted value.
      SkeletonKey injects element 0 only, so it carries `api-key`: the JWT and `source`
      must come from the caller, and the docs do not say how the JWT is obtained. Two
      vendor pages disagree -- the example on https://askroger.ai/api uses `x-api-key`
      against https://api.askroger.ai/dev/v1/search/data while the reference uses
      `api-key` against /v1; the reference is taken as authoritative here and the
      conflict is unresolved. The reference says \"We currently offer custom pricing
      plans tailored to your specific needs. Tiered pricing will be launching soon!\"
      and routes credentials through a Telegram contact, so there is no self-serve
      signup and billing stays null. https://app.askroger.ai/api/reference is
      client-rendered and still yields nothing to a fetch. Verified from docs only,
      not by a call through the proxy, so promoted_by stays unset. ToS not reviewed."
    source: null
