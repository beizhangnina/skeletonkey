      inject, and `Stripe-Version` with secret: false, since the docs say \"you must
      include the `Stripe-Version` header\" and name the preview version literally --
      it is a required header but not a credential. The key is not any Stripe key:
      the docs say \"your API key must have the Data > Metrics > Read permission\",
      enabled on a restricted key at https://dashboard.stripe.com/apikeys, and a key
      without it returns 403 `metric_inaccessible`. Access is gated on joining the
      preview, which the docs do by POSTing an email address to
      https://docs.stripe.com/preview/register with `{\"preview\":
      \"analytics_core_eng_preview\"}`; that was NOT done -- no sign-up was attempted
