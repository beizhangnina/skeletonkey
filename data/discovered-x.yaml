      auth_header/auth_format stay null because the vendor documents no credential
      anywhere and the schema has no \"none\" value; access_mode is keyless because
      there is no account to hold. Two caveats an agent should carry: agents.md says
      \"Reads are cached 30 seconds; do not poll faster\", and the write path is not
      an API write at all -- /api/tx and the MCP `prepare_*` tools \"return unsigned
      transactions\" for the caller's own wallet to sign, with the server holding no
