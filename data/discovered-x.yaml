      \"Limits differ between accounts ... Read your own limits from this endpoint
      rather than assuming them\" -- the example response shows a cap of 10 pts/day
      against rates of 0.035-0.28 pts per 1M input tokens. The 1M figure in the post
      matches the documented 1,048,576-token context window of several models, not a
      daily quota. The post's \"15 models\" is likewise close but not the vendor's
      number: the catalog has 16 model pages, and the docs say \"GET /v1/models is the
      source of truth for what is available -- a page existing here does not guarantee
      the model is currently published.\" Also per-key rate limits of 30 requests a
      minute and 8 concurrent requests on platform admission, and 20 requests a minute
      at the gateway. Verified from the vendor's docs only -- no call was made through
      the SkeletonKey proxy, so promoted_by stays unset. ToS not reviewed, but the
      vendor's own API terms page is linked from the Token Factory guide, which states
      Token Factory is \"a free trial and development service, not for production\"
      and that \"Reselling access is not allowed\" -- relevant to any routing
      decision."
