    tos_notes: "Discovered 2026-10-29 from X, posted by the vendor. Public.com's
      brokerage API places real orders in a real brokerage account -- stocks and
      ETFs, equity and index options, corporate bonds and treasuries, prediction
      market event contracts, and crypto -- so a wrong call here moves money, not
      just data. Verified 2026-10-29 against the vendor's own quickstart
      https://public.com/api/docs/quickstart: authentication is TWO steps, and only
      the second one carries a header SkeletonKey can inject. First `curl --request
      POST --url https://api.public.com/userapiauthservice/personal/access-tokens`
      with a JSON body of `{\"validityInMinutes\": 123, \"secret\":
      \"YOUR_SECRET_KEY\"}` returns `{\"accessToken\": \"...\"}`; the docs then say
      \"Subsequently you use the accessToken to authenticate any API request:
      `Authorization: Bearer YOUR_ACCESS_TOKEN`\", shown against `GET
      https://api.public.com/userapigateway/trading/account`. auth_header/auth_format
      therefore describe the SHORT-LIVED access token, not the long-lived secret key:
      injecting the secret into that header would 401, and the token expires after
      the validityInMinutes the caller chose, so something has to refresh it. Base
      URL is https://api.public.com, with auth paths under /userapiauthservice and
      trading/data paths under /userapigateway. https://public.com/api/docs/faq gives
      a rate limit of \"10 requests per second per account, across all endpoints\",
      says there is no WebSocket, webhook or stream (poll instead), and that
      preflight endpoints return \"the estimated cost, commission, and fees without
      placing anything\". The usage terms matter for this index: the API Disclosures
      box on https://public.com/api states \"The Public Individual API is for your
      own personal, non-commercial use\" and \"You are responsible for all trades
      made via the API\", pointing at
      https://public.com/disclosures/individual-API-program (not reviewed) -- so
      this is a row an agent operating its OWN Public account can use, not something
      to resell or share. Verified from docs only; no account was created and no call
      was made, so promoted_by stays unset."
