      accepts the key in the x-api-key header, which is how Anthropic SDKs
      authenticate\" (Authorization wins if both are present). Three limits are worth
      recording as facts rather than as the post's framing. First, \"Token Factory is
      available on the China site only.\" Second, the key is account-gated: it is
      created the first time you open Token Factory, and \"Accounts that are still
      under review don't get a key.\" Third, and a correction to the source post: the
      vendor documents no \"1M tokens/day\" allowance. The daily cap is counted in
