      also note the API works in sandboxes, that metric ids differ between live and
      sandbox mode, that there is no pagination, and that results come back in minor
      units (cents) or basis points. Stripe publishes no price for this API on the
      documentation, so billing stays null. Verified from docs only, not by a call
      through the proxy, so promoted_by stays unset. ToS not reviewed."
