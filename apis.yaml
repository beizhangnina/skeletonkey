        FAQ), and the People Enrichment reference says free-account access to
        /people/match "Requires an Apollo account registered with a work email address.
        Additional account eligibility requirements may apply." But the create-an-API-key
        doc says plainly "Access to Apollo API depends on your Apollo plan. If you need
        access, upgrade your plan" -- so which endpoints a free account may call is NOT
        established, and free_tier_covers_api stays null rather than guessing either way.
        The plan table itself is client-rendered, so no plan price and no free credit
        allowance could be read off the page; credits reset each billing cycle and do not
        roll over.
