    human_steps:
      - >-
        Create a key at https://agent.tinyfish.ai/api-keys ("Create API Key").
        The docs warn the key "are shown only once", so copy it immediately.
      - >-
        Each product answers on its own host (search, fetch, agent, browser),
        so the base_url above covers Search only; Fetch is
        POST https://api.fetch.tinyfish.ai with the same X-API-Key header.
    status: docs-verified
    offering:
      summary: >-
        Web search, page fetch/extract, browser automation and research APIs,
        each on its own host and all keyed by one X-API-Key header.
      categories:
        - search
        - web-scraping
        - agents
      endpoint_count: null
      model_count: null
      count_note: >-
        docs.tinyfish.ai/index.md names six products (Agent, Search, Fetch,
        Browser, Research, Datasets); TinyFish publishes no endpoint count.
      free_tier:
        available: true
        what: >-
          "Search, Fetch and Research are free within a daily allowance; beyond
          it they draw from your wallet" (docs.tinyfish.ai/index.md). The
          reference pages give the numbers: "Search is free up to 12,000
          requests per day" and "Fetch is free up to 1,000 URLs per day,
          counted per successfully fetched URL"; Research's FAQ says "the first
          2 completed runs each day are free".
        limits: >-
          Allowances reset at 00:00 UTC. Beyond them a request needs a positive
          wallet balance or returns HTTP 402 INSUFFICIENT_CREDITS. Separate
          rate limits apply: personal accounts default to 30 requests/minute on
          Search and 150 URLs/minute on Fetch. Research beyond the 2 free runs
          is $2 (Deep) / $3 (Max) per completed run; TinyFish publishes no
          per-request price for Search or Fetch past the allowance.
        requires_key: true
        requires_account: true
      connect:
        base_url: https://api.search.tinyfish.ai
        auth: api_key
        auth_header: X-API-Key
        auth_format: "{key}"
      catalog_url: https://docs.tinyfish.ai/llms.txt
      verified_url: https://docs.tinyfish.ai/search-api/reference.md
      verified_date: "2026-10-30"
      source_urls:
        - https://docs.tinyfish.ai
        - https://docs.tinyfish.ai/index.md
        - https://docs.tinyfish.ai/llms.txt
        - https://docs.tinyfish.ai/authentication
        - https://docs.tinyfish.ai/search-api/reference.md
        - https://docs.tinyfish.ai/fetch-api/reference.md
        - https://docs.tinyfish.ai/faq.md
        - https://docs.tinyfish.ai/for-coding-agents.md
      highlights:
        - id: GET https://api.search.tinyfish.ai
          kind: endpoint
          free: true
          note: >-
            Search API. Params query, purpose, location, language,
            include_domains, recency_minutes, page. Free to 12,000/day.
          url: https://docs.tinyfish.ai/search-api/reference.md
        - id: POST https://api.fetch.tinyfish.ai
          kind: endpoint
          free: true
          note: >-
            Fetch API: up to 10 urls per request, format html|markdown|json.
            This is what the skill's page reads use. Free to 1,000 URLs/day.
          url: https://docs.tinyfish.ai/fetch-api/reference.md
    billing:
      model: free_tier+payg
      free_tier_note: >-
        Daily free allowances, per TinyFish's own reference pages: Search
        12,000 requests/day, Fetch 1,000 successfully fetched URLs/day, both
        resetting at 00:00 UTC, and 2 free Research runs/day. Past the
        allowance a call draws from a prepaid wallet
        (https://agent.tinyfish.ai/wallet) or fails with HTTP 402. No
        per-request price is published for Search or Fetch, so min_topup and a
        number stay null.
      free_tier_covers_api: true
      verified_url: https://docs.tinyfish.ai/search-api/reference.md
      verified_date: "2026-10-30"
    tos_notes: >-
      The skill reaches TinyFish through treg's route-preference header
      (`X-Treg-Route-Prefer: tinyfish`) on treg.web.search / treg.web.extract;
      direct, those are the Search and Fetch APIs above. The skill's third call,
      treg.web.map ("every URL on a site"), has NO documented TinyFish
      equivalent: docs.tinyfish.ai/llms.txt lists Agent, Search, Fetch,
      Browser, Research and Datasets only, with no site-map or crawl endpoint.
      TinyFish also documents agent-paid wallet top-ups over the Machine
      Payments Protocol (docs.tinyfish.ai/agent-payments.md); SkeletonKey pays
      in fiat, so that path is recorded, not routed to. Terms of service were
      not reviewed. Read off TinyFish's own docs on 2026-10-30 with no sign-up
      and no API call.
    source: https://docs.tinyfish.ai/search-api/reference.md
    checked_date: "2026-10-30"

